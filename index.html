<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Felices 50 Años! - Sorpresas del Día</title>
    <script src="https://cloudflare.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1115;
            --card-bg: #181b22;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #f4f4f6;
            --text-muted: #9ca3af;
            --locked-overlay: rgba(15, 17, 21, 0.85);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            padding-bottom: 50px;
        }
        .hero {
            text-align: center;
            padding: 50px 20px 30px;
            background: radial-gradient(circle at top, #232732 0%, var(--bg-dark) 70%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }
        .badge {
            display: inline-block;
            padding: 5px 14px;
            border: 1px solid var(--gold);
            color: var(--gold);
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            user-select: none;
        }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--gold-light);
            margin-bottom: 10px;
        }
        .subtitle {
            max-width: 550px;
            margin: 0 auto 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .reloj-actual {
            font-size: 0.85rem;
            color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 8px;
        }
        .timeline-container {
            max-width: 480px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 35px;
            position: relative;
        }
        .timeline-container::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: linear-gradient(to bottom, transparent, rgba(212, 175, 55, 0.3), transparent);
            transform: translateX(-50%);
            z-index: 0;
        }
        .qr-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .qr-card.unlocked { border-color: var(--gold); }
        .qr-card.final-special {
            background: linear-gradient(145deg, #1d1a12, #181b22);
            border: 2px solid var(--gold);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }
        .step-number { color: var(--gold); font-weight: 600; letter-spacing: 1px; }
        .unlock-time {
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 10px;
            border-radius: 6px;
            color: var(--text-muted);
        }
        .qr-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #fff;
        }
        .qr-card p.desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
        .qr-wrapper {
            position: relative;
            width: 210px;
            height: 210px;
            margin: 0 auto 15px;
            background: #ffffff;
            padding: 15px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .qr-code-box img { display: block; width: 100%; height: 100%; }
        .qr-card.locked .qr-code-box { filter: blur(12px); opacity: 0.25; pointer-events: none; }
        .lock-overlay {
            position: absolute;
            inset: 0;
            background: var(--locked-overlay);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            color: var(--gold-light);
            backdrop-filter: blur(4px);
        }
        .lock-icon { font-size: 2rem; margin-bottom: 8px; }
        .countdown {
            font-family: monospace;
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 1px;
        }
        .countdown-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .unlocked-message {
            margin-top: 15px;
            padding: 12px;
            background: rgba(212, 175, 55, 0.12);
            border-left: 3px solid var(--gold);
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--gold-light);
            text-align: left;
            white-space: pre-line;
        }
        .btn-action {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 22px;
            background: var(--gold);
            color: #000;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
        }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        .modal.hidden { display: none; }
        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--gold);
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            padding: 35px 25px;
            text-align: center;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        .modal-icon { font-size: 3rem; margin-bottom: 10px; }
        .modal-content h2 { font-family: 'Playfair Display', serif; color: var(--gold-light); margin-bottom: 15px; }
        .modal-content p { font-size: 0.95rem; color: var(--text-main); margin-bottom: 25px; white-space: pre-line; }
        .btn-video {
            display: inline-block;
            padding: 12px 25px;
            background: var(--gold);
            color: #000;
            font-weight: 600;
            text-decoration: none;
            border-radius: 10px;
        }
        footer { text-align: center; margin-top: 50px; color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
